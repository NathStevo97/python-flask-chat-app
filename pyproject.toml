[project]
name = "python-flask-chat-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-socketio>=5.6.1",
    "python-dotenv>=1.2.1",
    "werkzeug>=3.1.6",
    "python-socketio>=5.16.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.5",
    "pylint>=4.0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
